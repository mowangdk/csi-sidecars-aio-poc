name: presubmit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  # verify runs the code-quality gates that upstream kubernetes-csi expects
  # (gofmt, boilerplate license headers, shellcheck). These are scoped
  # to the hand-maintained source of truth under tools/ and to the shell
  # scripts we own. This lint job does not cover the generated assembly area
  # (cmd/, pkg/, staging/). Upstream CI does not validate our transformations
  # or unified dependencies; those need assembled-tree tests, not just lint.
  verify:
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
    - name: preload locked Linux builder
      run: docker pull "$(python3 -B tools/scripts/build_environment.py image)"
    - name: tooling tests, gofmt, and license headers in locked builder
      run: python3 -B tools/scripts/isolated_sync.py --engine docker --tooling-only
    # shellcheck: lint the shell scripts we own (sync/cleanup + CI entrypoints).
    # --severity=warning keeps the gate on real bugs/warnings while allowing
    # info-level style suggestions (e.g. SC2086 quoting) that would otherwise
    # add noise to the tightly-tuned sync.sh. shellcheck is preinstalled on
    # ubuntu-latest runners.
    - name: shellcheck
      run: shellcheck --severity=warning tools/scripts/*.sh .prow.sh .cloudbuild.sh

  build:
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
    - uses: actions/setup-go@v5
      with:
        go-version: "1.26.5"
    # The generated tree is committed, so this job is a plain build of the
    # checkout plus the same checkpoints sync.sh runs after assembling
    # (maintained-package tests and CLI smoke checks). vendored builds need
    # no network access.
    - name: build committed tree
      run: make build
    - name: maintained package tests
      run: go test -timeout=5m ./cmd/csi-sidecars/... ./pkg/attacher/cmd/csi-attacher/config/...
    - name: CLI smoke check
      run: python3 tools/scripts/verify_artifacts.py cli

  e2e-hostpath:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        go: ["1.26.5"]
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - run: |
        echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
    - run: go version
    # The generated tree is committed, so the Prow e2e builds directly from
    # this checkout.
    - run: ./.prow.sh 2>&1
    - run:  grep "Ginkgo ran" -B 4 .prow.sh.log
