name: presubmit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  # verify runs the code-quality gates that upstream kubernetes-csi expects
  # (gofmt, boilerplate license headers, shellcheck). These are scoped
  # to the hand-maintained source of truth under tools/ and to the shell
  # scripts we own; the generated assembly area (cmd/, pkg/, staging/) mirrors
  # upstream code and is covered by each upstream project's own CI, so we do
  # NOT re-verify it here (its formatting/boilerplate conventions are theirs).
  verify:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        go: ["1.26.5"]
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - run: go version
    # gofmt: the tools/ Go files are the source of truth and must be
    # gofmt-clean. gofmt -l prints any file that is not formatted; a non-empty
    # list fails the job.
    - name: gofmt
      run: |
        unformatted=$(gofmt -l tools/)
        if [ -n "$unformatted" ]; then
          echo "The following files are not gofmt-clean:"
          echo "$unformatted"
          echo "Run: gofmt -w tools/"
          exit 1
        fi
    # boilerplate: every hand-maintained .go file must carry the Apache 2.0
    # license header (see release-tools/boilerplate/boilerplate.go.txt).
    - name: boilerplate (license headers)
      run: |
        missing=0
        while IFS= read -r f; do
          if ! head -3 "$f" | grep -q "Copyright .* The Kubernetes Authors"; then
            echo "missing license header: $f"
            missing=1
          fi
        done < <(find tools -name '*.go')
        exit $missing
    # shellcheck: lint the shell scripts we own (sync/cleanup + CI entrypoints).
    # --severity=warning keeps the gate on real bugs/warnings while allowing
    # info-level style suggestions (e.g. SC2086 quoting) that would otherwise
    # add noise to the tightly-tuned sync.sh.
    - name: shellcheck
      run: |
        sudo apt-get update && sudo apt-get install -y shellcheck
        shellcheck --severity=warning tools/scripts/*.sh .prow.sh .cloudbuild.sh

  build:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        go: ["1.26.5"]
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - run: |
        echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
    - run: go version
    - run: ./tools/scripts/cleanup.sh
    - run: |
        python3 -m venv .venv && source .venv/bin/activate
        ./tools/scripts/sync.sh

  unit:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        go: ["1.26.5"]
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - run: |
        echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
    - run: go version
    - run: ./tools/scripts/cleanup.sh
    # Assemble the tree so the hand-maintained tools/ tests (symlinked into
    # cmd/) build against the generated go.mod/go.work.
    - run: |
        python3 -m venv .venv && source .venv/bin/activate
        ./tools/scripts/sync.sh
    # Run go test over the hand-maintained sources only. These are assembled
    # into cmd/csi-sidecars (AIO main + config) and pkg/attacher/.../config via
    # symlinks from tools/, so they compile with their generated siblings
    # present. We scope the run to these packages on purpose: the broader
    # `make test-go` also pulls in synced upstream tests (e.g. gomock-based
    # attacher/snapshotter tests) whose vendored deps don't survive the sync
    # import rewrite. Those are covered by the upstream projects' own CI.
    - run: |
        go test ./cmd/csi-sidecars/... ./pkg/attacher/cmd/csi-attacher/config/...
    - run: |
        go vet ./cmd/csi-sidecars/... ./pkg/attacher/cmd/csi-attacher/config/...

  e2e-hostpath:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        go: ["1.26.5"]
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - run: |
        echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
    - run: go version
    - run: ./tools/scripts/cleanup.sh 2>&1
    - run: |
        python3 -m venv .venv && source .venv/bin/activate
        ./tools/scripts/sync.sh 2>&1
    - run: ./.prow.sh 2>&1
    - run:  grep "Ginkgo ran" -B 4 .prow.sh.log
